[package]
name = "orion-ann"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned build, calibration, search and cache API for Orion ANN"
readme = "README.md"
keywords = ["ann", "vector-search", "similarity"]
categories = ["algorithms"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]
edition = "2021"

[features]
experimental-graph = ["orion-ann-core/experimental-graph"]
file-queries = []
benchmark = ["cli", "orion-ann-core/benchmark"]
default = ["parlay"]
parlay = ["orion-ann-core/parlay"]
cli = ["dep:clap"]

[dependencies]
orion-ann-platform = { version = "0.1.0", path = "../orion-platform" }
orion-ann-diagnostics = { version = "0.1.0", path = "../orion-diagnostics" }
orion-ann-core = { version = "0.1.0", path = "../orion-core", default-features = false }
orion-ann-diskann = { version = "0.1.0", path = "../orion-diskann" }
orion-ann-vector = { version = "0.1.0", path = "../orion-vector" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
byteorder.workspace = true
libc.workspace = true
log.workspace = true
comfy-table.workspace = true
clap = { workspace = true, optional = true }
sha2 = "0.10"
bytemuck.workspace = true

[dev-dependencies]
tempfile = "3"
orion-ann-parlay = { version = "0.1.0", path = "../orion-parlay", features = ["reference-tests"] }

# On AArch64 sha2 0.10 enables runtime SHA instruction dispatch via this feature.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[[example]]
name = "business_search"
required-features = ["file-queries"]
