[package]
name = "orion-ann-runtime"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned build, calibration, search and cache API for Orion ANN"
readme = "README.md"
keywords = ["ann", "vector-search", "similarity"]
categories = ["algorithms"]
include = ["src/**", "tests/**", "configs/**", "Cargo.toml", "README.md", "LICENSE"]
edition = "2021"

[features]
default = ["parlay"]
parlay = ["dep:orion-ann-parlay"]
cli = ["dep:clap", "dep:serde_yaml"]

[dependencies]
orion-ann-parlay = { version = "0.1.0", path = "../orion-parlay", optional = true }
orion-ann = { version = "0.1.0", path = "../orion" }
orion-ann-diskann = { version = "0.1.0", path = "../orion-diskann" }
orion-ann-vector = { version = "0.1.0", path = "../vector" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
byteorder.workspace = true
libc.workspace = true
log.workspace = true
comfy-table.workspace = true
clap = { workspace = true, optional = true }
sha2 = "0.10"
bytemuck.workspace = true
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
orion-ann-parlay = { version = "0.1.0", path = "../orion-parlay", features = ["reference-tests"] }
