[package]
name = "orion-ann-diskann"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Orion ANN fork of DiskANN graph construction and storage"
readme = "README.md"
keywords = ["ann", "vector-search", "similarity"]
categories = ["algorithms"]
include = ["src/**", "tests/**", "configs/**", "Cargo.toml", "README.md", "LICENSE"]
edition = "2024"

[features]
default = []
orion = []
indificatif = ["dep:indicatif"]

[dependencies]
orion-ann-vector = { version = "0.1.0", path = "../vector" }
orion-ann-platform = { version = "0.1.0", path = "../platform" }
orion-ann-logger = { version = "0.1.0", path = "../orion-logger" }
rayon = { workspace = true }
crossbeam = { workspace = true }
hashbrown = { workspace = true }
half = { workspace = true }
num-traits = { workspace = true }
byteorder = {workspace = true }
bit-vec = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
log = {workspace = true }
bytemuck = { workspace = true }
ndarray = {workspace = true }
indicatif = { workspace = true, optional = true }
anyhow = "1"
memmap2 = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_family = "unix")'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

