[workspace]
members = [
    "adsampling",
    "benchmark",
    "diskann",
    "logger",
    "platform",
    "staged_diskann",
    "staged_diskann_py",
    "vector",
]
# `staged_diskann_py` is a PyO3 cdylib — it expects Python symbols
# (PyBytes_Size, PyErr_Clear, ...) to be resolved at *runtime* by
# the Python interpreter that dlopen's the .so. `cargo build` from
# the workspace root tries to link it as a normal cdylib and fails
# on macOS (the linker is strict about unresolved symbols).
#
# Exclude it from `default-members` so plain `cargo build` /
# `cargo check` from root skip it. It's still a full workspace
# member — `cargo build -p staged_diskann_py` works (with the
# right linker flags), and `maturin develop --release` from
# inside `staged_diskann_py/` is the recommended build path
# documented in `benchmark/scripts/staged_python_binding_bench.py`.
default-members = [
    "adsampling",
    "benchmark",
    "diskann",
    "logger",
    "platform",
    "staged_diskann",
    "vector",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
byteorder = "1"

# Error handling
thiserror = "2"

# Concurrency
rayon = "1"
crossbeam = "0.8"

# Collecions
hashbrown = "0.15"


# Numeric
half = { version = "2", features = ["bytemuck"] }
num-traits = "0.2"
bytemuck = { version = "1", features = ["derive"] }
ndarray = { version = "0.16", features = ["rayon", "serde"] }


# Data structures
bit-vec = "0.8"

# Random
rand = "0.10"

# Logging
log = "0.4"
env_logger = "0.11"
once_cell = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# I/O
memmap2 = "0.9"
libc = "0.2"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Progress
indicatif = "0.17"

# Table ouput
comfy-table = "=7.1.4"

# JSON
serde_json = "1"

# Test need
approx = "0.5"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 2
lto = "thin"
codegen-units = 4
