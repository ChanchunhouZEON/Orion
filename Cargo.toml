[workspace]
members = [
    "benchmark",
    "diskann",
    "logger",
    "platform",
    "staged_diskann",
    "vector",
    "ssd_diskann",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
byteorder = "1"

# Error handling
thiserror = "2"

# Concurrency
rayon = "1"
crossbeam = "0.8"

# Collecions
hashbrown = "0.15"


# Numeric
half = { version = "2", features = ["bytemuck"] }
num-traits = "0.2"
bytemuck = { version = "1", features = ["derive"] }
ndarray = { version = "0.16", features = ["rayon", "serde"] }


# Data structures
bit-vec = "0.8"

# Random
rand = "0.10"

# Logging
log = "0.4"
env_logger = "0.11"
once_cell = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# I/O
memmap2 = "0.9"
libc = "0.2"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Progress
indicatif = "0.17"

# Table ouput
comfy-table = "=7.1.4"

# JSON
serde_json = "1"

# Test need
approx = "0.5"

# Visualization
plotters = "0.3"
ndarray-linalg = "0.17"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 2
lto = "thin"
codegen-units = 4
