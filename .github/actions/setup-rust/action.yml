name: Repository Rust toolchain
description: Install the toolchain declared by rust-toolchain.toml.
inputs:
  targets:
    description: Optional extra compilation target
    default: ''
runs:
  using: composite
  steps:
    - name: Install pinned Rust
      shell: bash
      env:
        EXTRA_TARGET: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
        test -n "$channel"
        args=(--profile minimal --component clippy)
        if [[ -n "$EXTRA_TARGET" ]]; then
          args+=(--target "$EXTRA_TARGET")
        fi
        rustup toolchain install "$channel" "${args[@]}"
        rustc --version
        cargo --version
