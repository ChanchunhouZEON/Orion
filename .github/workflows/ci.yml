# Compilation is mandatory for every SIMD variant. Runtime coverage is
# reported separately: GitHub-hosted x86 runners do not guarantee AVX-512.
name: Orion CI

on:
  push:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'vector/**'
      - 'orion-diskann/**'
      - 'orion-core/**'
      - 'orion-cli/**'
      - 'orion-runtime/**'
      - 'orion-diagnostics/**'
      - 'orion-error/**'
      - 'orion-wasm/**'
      - 'orion-parlay/**'
      - 'orion-py/**'
      - 'platform/**'
      - 'adsampling/**'
      - 'orion-logger/**'
      - 'benchmark/**'
      - '.cargo/**'
      - '.github/**'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'vector/**'
      - 'orion-diskann/**'
      - 'orion-core/**'
      - 'orion-cli/**'
      - 'orion-runtime/**'
      - 'orion-diagnostics/**'
      - 'orion-error/**'
      - 'orion-wasm/**'
      - 'orion-parlay/**'
      - 'orion-py/**'
      - 'platform/**'
      - 'adsampling/**'
      - 'orion-logger/**'
      - 'benchmark/**'
      - '.cargo/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      require_avx512_runtime:
        description: Fail if either AVX-512 variant lacks runtime coverage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orion-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  allocator-safety:
    name: Allocation and exclusive graph access / Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri and its standard library sources
        run: rustup toolchain install nightly --profile minimal --component miri --component rust-src
      - name: Check allocation, aliasing and thread ownership
        # Miri checks Rust memory safety, not Linux madvise. The ordinary
        # portable-api job runs the large-allocation/THP regression on Linux.
        run: |
          cargo +nightly miri test --locked -p orion-ann-diskann --lib --target x86_64-unknown-linux-gnu common::aligned_allocator -- --skip large_allocation_preserves_length_zeroing_and_alignment
          cargo +nightly miri test --locked -p orion-ann-diskann --test allocator_adversarial --target x86_64-unknown-linux-gnu
          cargo +nightly miri test --locked -p orion-ann-core --no-default-features --lib model::phased_graph::tests::concurrency --target x86_64-unknown-linux-gnu
          MIRIFLAGS=-Zmiri-disable-isolation RAYON_NUM_THREADS=1 cargo +nightly miri test --locked -p orion-ann-core --no-default-features --test sidecar_safety --target x86_64-unknown-linux-gnu safe_ -- --test-threads=1

  graph-safety:
    name: Adversarial input / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Reject malformed input and verify update publication
        run: |
          cargo test --locked -p orion-ann-diskann --test allocator_adversarial
          cargo test --locked -p orion-ann-core --test sidecar_safety
          cargo test --locked -p orion-ann-core --release --test sidecar_safety
          cargo test --locked -p orion-ann-core --no-default-features --lib model::phased_graph::tests

  randomized-safety:
    name: Randomized graph stress / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Compare one million updates with the reference model
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p orion-ann-core --no-default-features --release --lib model::phased_graph::tests::randomized -- --ignored --nocapture 2>&1 | tee graph-randomized.log
      - name: Randomized sidecar layouts and scalar distance parity
        run: cargo test --locked -p orion-ann-core --release --test sidecar_randomized -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-randomized-${{ matrix.os }}
          path: graph-randomized.log
          if-no-files-found: warn

  build-and-test:
    name: Linux / ${{ matrix.simd }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - simd: avx2
            features: '+avx2,+fma,+f16c'
            cpu_flags: 'avx2 fma f16c'
          - simd: avx512
            features: '+avx2,+fma,+f16c,+avx512f,+avx512bw,+avx512dq,+avx512vl'
            cpu_flags: 'avx2 fma f16c avx512f avx512bw avx512dq avx512vl'
          - simd: avx512-popcnt
            features: '+avx2,+fma,+f16c,+avx512f,+avx512bw,+avx512dq,+avx512vl,+avx512vpopcntdq'
            cpu_flags: 'avx2 fma f16c avx512f avx512bw avx512dq avx512vl avx512_vpopcntdq'
    env:
      RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=${{ matrix.features }} -D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.simd }}
      - name: Detect runtime support on this runner
        id: cpu
        env:
          REQUIRED_FLAGS: ${{ matrix.cpu_flags }}
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          if bash .github/scripts/check-cpu-features.sh "$REQUIRED_FLAGS"; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
          fi
      # Explicit --target keeps SIMD flags out of host build scripts/proc macros.
      # Even on an AVX2-only host we can compile and link AVX-512 test binaries.
      - name: Compile libraries and CLI
        run: cargo check --locked -p orion-ann-vector -p orion-ann-core -p orion-ann-diskann -p orion-ann-cli -p orion-ann --target x86_64-unknown-linux-gnu
      - name: Compile tests and benchmark executables
        run: |
          cargo test --locked -p orion-ann-vector --release --no-run --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann-diskann --test padded_dataset --release --no-run --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann-core --release --lib --test build --test dynamic_index --test dynamic_cascade --test sidecar_migration --test sidecar_safety --test native_u8_search --no-run --target x86_64-unknown-linux-gnu
          cargo build --locked --target-dir target --manifest-path benchmark/Cargo.toml --release --bin orion-sweep --bin diskann_sweep --bin prefilter_progress --target x86_64-unknown-linux-gnu
      - name: Execute SIMD regression tests
        if: steps.cpu.outputs.supported == 'true'
        env:
          ORION_TEST_REQUIRED_BACKENDS: ${{ matrix.simd }}
        run: |
          cargo test --locked -p orion-ann-vector --release --target x86_64-unknown-linux-gnu -- --nocapture
          cargo test --locked -p orion-ann-diskann --test padded_dataset --release --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann-core --release --test build --test dynamic_index --test dynamic_cascade --test sidecar_migration --test sidecar_safety --test native_u8_search --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann-core --release --lib model::dataset --target x86_64-unknown-linux-gnu -- --nocapture
          cargo test --locked --manifest-path benchmark/Cargo.toml --release --bin diskann_sweep --bin prefilter_progress --target x86_64-unknown-linux-gnu
          DISKANN_BINARY=target/x86_64-unknown-linux-gnu/release/diskann_sweep python3 benchmark/scripts/tests/check_diskann_streaming.py
      - name: Report runtime coverage
        if: always()
        env:
          SUPPORTED: ${{ steps.cpu.outputs.supported }}
          SIMD: ${{ matrix.simd }}
          REQUIRE_RUNTIME: ${{ inputs.require_avx512_runtime }}
        run: |
          if [[ "$SUPPORTED" == true ]]; then
            echo "$SIMD: hardware supported; see test steps for execution results." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$SIMD: runtime tests NOT executed; compilation checks remain required." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$SIMD runtime coverage unavailable on this runner."
            if [[ "$SIMD" == avx2 || "$REQUIRE_RUNTIME" == true ]]; then
              exit 1
            fi
          fi

  compile-check-cross:
    name: macOS ARM / native and cross checks
    runs-on: macos-15
    timeout-minutes: 45
    # Override repository linker flags: hosted macOS does not provide ld.lld.
    env:
      RUSTFLAGS: '-C target-feature=+dotprod'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm-cross
      - name: Verify ARM runner
        run: test "$(uname -m)" = arm64
      - name: Native library and CLI checks
        run: cargo check --locked -p orion-ann-vector -p orion-ann-core -p orion-ann-diskann -p orion-ann-cli -p orion-ann
      - name: Native NEON regressions
        env:
          ORION_TEST_REQUIRED_BACKENDS: 'scalar,neon,dotprod'
        run: |
          cargo test --locked -p orion-ann-vector --release
          cargo test --locked -p orion-ann-diskann --test padded_dataset --release
          cargo test --locked -p orion-ann-core --release --lib model::dataset
          cargo test --locked -p orion-ann-core --release --test build --test dynamic_index --test dynamic_cascade --test sidecar_migration --test sidecar_safety --test native_u8_search
      - name: Verify the public facade and opt-in interfaces
        run: |
          cargo test --locked -p orion-ann --doc
          cargo test --locked -p orion-ann-core --features benchmark --doc
          python3 .github/scripts/check_workspace_features.py
          cargo fmt --manifest-path benchmark/Cargo.toml --all --check
          cargo check --locked --manifest-path benchmark/Cargo.toml --all-targets
          cargo test --locked -p orion-ann-core --features benchmark --tests
      - name: Native ParlayANN FFI and service regressions
        run: cargo test --locked -p orion-ann-parlay -p orion-ann -p orion-ann-cli
      - name: Standalone Rust construction without ParlayANN
        run: cargo test --locked -p orion-ann-core --no-default-features --test build
      # Native Linux jobs validate the C++ backend; cross-check Rust without a Linux C++ sysroot.
      - name: Cross-check AVX2 fallback
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+avx2,+fma,+f16c'
        run: cargo check --locked -p orion-ann-vector -p orion-ann-core -p orion-ann-diskann -p orion-ann-cli -p orion-ann --no-default-features --target x86_64-unknown-linux-gnu
      - name: Cross-check AVX-512
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+avx2,+fma,+f16c,+avx512f,+avx512bw,+avx512dq,+avx512vl,+avx512vpopcntdq'
        run: cargo check --locked -p orion-ann-vector -p orion-ann-core -p orion-ann-diskann -p orion-ann-cli -p orion-ann --no-default-features --target x86_64-unknown-linux-gnu
      - name: Vector Clippy
        run: cargo clippy --locked -p orion-ann-vector --release -- -D warnings

  summary:
    needs: [compile-check-cross, build-and-test, python-api, portable-api, allocator-safety, graph-safety, randomized-safety, wasm-replay]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all compilation and eligible runtime checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name, job in results.items():
                  summary.write(f"- {name}: {job['result']}\n")
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          PY

  python-api:
    name: Python API / CLI consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+avx2,+fma,+f16c'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-api
      - name: Check CPU and install local test dependencies
        run: |
          bash .github/scripts/check-cpu-features.sh 'avx2 fma f16c'
          python -m pip install 'numpy>=1.24,<3'
          cargo fetch --locked
      - name: Byte-distance, shared runtime and CLI regressions
        run: |
          # Debug overflow checks cover the scalar stream fallback on AVX2.
          cargo test --locked -p orion-ann-vector --test native_u8_stream
          cargo test --locked -p orion-ann -p orion-ann-cli
          cargo test --locked -p orion-ann-core --test error_contract
      - name: Concurrent search and NumPy/CLI parity (caches and snapshots)
        run: |
          python orion-py/tests/run.py
          python orion-py/tests/run.py --profile python

  portable-api:
    name: Native API / ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            backends: 'scalar,avx2'
          - os: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            backends: 'scalar,neon'
          - os: macOS
            arch: x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
            backends: 'scalar,avx2'
          - os: macOS
            arch: ARM64
            runner: macos-15
            host: aarch64-apple-darwin
            backends: 'scalar,neon'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Override repository ISA/linker flags; validate downstream-style runtime dispatch.
      RUSTFLAGS: '-D warnings'
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-api-${{ matrix.host }}
      - name: Verify native host
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          uname -sm
      - name: Portable distance and service regressions
        env:
          ORION_TEST_REQUIRED_BACKENDS: ${{ matrix.backends }}
        run: |
          cargo test --locked -p orion-ann-vector --release
          cargo test --locked -p orion-ann-core -p orion-ann-diagnostics -p orion-ann-parlay -p orion-ann -p orion-ann-cli
          cargo test --locked -p orion-ann-diskann --all-features
          cargo test --locked -p orion-ann-platform
      - name: Product quantization in ordinary builds
        run: |
          cargo test --locked -p orion-ann-core --no-default-features --lib --test product_quantization
          cargo test --locked -p orion-ann-diskann --no-default-features --test pq_scratch
      - name: Native Python and CLI parity
        run: |
          python -m pip install 'numpy>=1.24,<3'
          # The test launcher builds offline; cold runners need Python-only crates too.
          cargo fetch --locked
          python orion-py/tests/run.py
      - name: Public API examples and warning-free docs
        run: |
          cargo test --locked --doc -p orion-ann-core -p orion-ann
          cargo doc --locked --workspace --no-deps

  wasm-replay:
    name: WASM trace replay / native parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-replay
      - name: Install WASM target and matching binding generator
        run: |
          rustup target add wasm32-unknown-unknown
          VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Validate schema and production observer
        run: |
          cargo check --locked -p orion-ann-wasm
          cargo test --locked -p orion-ann-diagnostics --no-default-features
          cargo test --locked -p orion-ann --test trace_search
          cargo run --locked -p orion-ann --example export_trace -- target/native-trace.json
      - name: Build browser module and run actual WASM
        run: |
          cargo build --locked -p orion-ann-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir target/wasm-replay target/wasm32-unknown-unknown/debug/orion_ann_wasm.wasm
          printf '{"type":"module"}\n' > target/wasm-replay/package.json
          node orion-wasm/tests/replay.mjs target/wasm-replay target/native-trace.json
