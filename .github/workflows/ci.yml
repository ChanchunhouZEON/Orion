# Compilation is mandatory for every SIMD variant. Runtime coverage is
# reported separately: GitHub-hosted x86 runners do not guarantee AVX-512.
name: Orion CI

on:
  push:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'vector/**'
      - 'orion-diskann/**'
      - 'orion/**'
      - 'orion-cli/**'
      - 'orion-runtime/**'
      - 'orion-parlay/**'
      - 'orion-py/**'
      - 'platform/**'
      - 'adsampling/**'
      - 'orion-logger/**'
      - 'benchmark/**'
      - '.cargo/**'
      - '.github/**'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'vector/**'
      - 'orion-diskann/**'
      - 'orion/**'
      - 'orion-cli/**'
      - 'orion-runtime/**'
      - 'orion-parlay/**'
      - 'orion-py/**'
      - 'platform/**'
      - 'adsampling/**'
      - 'orion-logger/**'
      - 'benchmark/**'
      - '.cargo/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      require_avx512_runtime:
        description: Fail if either AVX-512 variant lacks runtime coverage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orion-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build-and-test:
    name: Linux / ${{ matrix.simd }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - simd: avx2
            features: '+avx2,+fma,+f16c'
            cpu_flags: 'avx2 fma f16c'
          - simd: avx512
            features: '+avx2,+fma,+f16c,+avx512f,+avx512bw,+avx512dq,+avx512vl'
            cpu_flags: 'avx2 fma f16c avx512f avx512bw avx512dq avx512vl'
          - simd: avx512-popcnt
            features: '+avx2,+fma,+f16c,+avx512f,+avx512bw,+avx512dq,+avx512vl,+avx512vpopcntdq'
            cpu_flags: 'avx2 fma f16c avx512f avx512bw avx512dq avx512vl avx512_vpopcntdq'
    env:
      RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=${{ matrix.features }} -D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.simd }}
      - name: Detect runtime support on this runner
        id: cpu
        env:
          REQUIRED_FLAGS: ${{ matrix.cpu_flags }}
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          if bash .github/scripts/check-cpu-features.sh "$REQUIRED_FLAGS"; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
          fi
      # Explicit --target keeps SIMD flags out of host build scripts/proc macros.
      # Even on an AVX2-only host we can compile and link AVX-512 test binaries.
      - name: Compile libraries and CLI
        run: cargo check --locked -p orion-ann-vector -p orion-ann -p orion-ann-diskann -p orion-ann-cli -p orion-ann-runtime --target x86_64-unknown-linux-gnu
      - name: Compile tests and benchmark executables
        run: |
          cargo test --locked -p orion-ann-vector --release --no-run --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann-diskann --test padded_dataset --release --no-run --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann --release --lib --test dynamic_index --test dynamic_cascade --test sidecar_migration --test native_u8_search --no-run --target x86_64-unknown-linux-gnu
          cargo build --locked -p benchmark --release --bin orion-sweep --bin diskann_sweep --bin prefilter_progress --target x86_64-unknown-linux-gnu
      - name: Execute SIMD regression tests
        if: steps.cpu.outputs.supported == 'true'
        env:
          ORION_TEST_REQUIRED_BACKENDS: ${{ matrix.simd }}
        run: |
          cargo test --locked -p orion-ann-vector --release --target x86_64-unknown-linux-gnu -- --nocapture
          cargo test --locked -p orion-ann-diskann --test padded_dataset --release --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann --release --test dynamic_index --test dynamic_cascade --test sidecar_migration --test native_u8_search --target x86_64-unknown-linux-gnu
          cargo test --locked -p orion-ann --release --lib model::dataset --target x86_64-unknown-linux-gnu -- --nocapture
          cargo test --locked -p benchmark --release --bin diskann_sweep --bin prefilter_progress --target x86_64-unknown-linux-gnu
          DISKANN_BINARY=target/x86_64-unknown-linux-gnu/release/diskann_sweep python3 benchmark/scripts/tests/check_diskann_streaming.py
      - name: Report runtime coverage
        if: always()
        env:
          SUPPORTED: ${{ steps.cpu.outputs.supported }}
          SIMD: ${{ matrix.simd }}
          REQUIRE_RUNTIME: ${{ inputs.require_avx512_runtime }}
        run: |
          if [[ "$SUPPORTED" == true ]]; then
            echo "$SIMD: hardware supported; see test steps for execution results." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$SIMD: runtime tests NOT executed; compilation checks remain required." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$SIMD runtime coverage unavailable on this runner."
            if [[ "$SIMD" == avx2 || "$REQUIRE_RUNTIME" == true ]]; then
              exit 1
            fi
          fi

  compile-check-cross:
    name: macOS ARM / native and cross checks
    runs-on: macos-15
    timeout-minutes: 45
    # Override repository linker flags: hosted macOS does not provide ld.lld.
    env:
      RUSTFLAGS: '-C target-feature=+dotprod'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm-cross
      - name: Verify ARM runner
        run: test "$(uname -m)" = arm64
      - name: Native library and CLI checks
        run: cargo check --locked -p orion-ann-vector -p orion-ann -p orion-ann-diskann -p orion-ann-cli -p orion-ann-runtime
      - name: Native NEON regressions
        env:
          ORION_TEST_REQUIRED_BACKENDS: 'scalar,neon,dotprod'
        run: |
          cargo test --locked -p orion-ann-vector --release
          cargo test --locked -p orion-ann-diskann --test padded_dataset --release
          cargo test --locked -p orion-ann --release --lib model::dataset
          cargo test --locked -p orion-ann --release --test dynamic_index --test dynamic_cascade --test sidecar_migration --test native_u8_search
      - name: Native ParlayANN FFI and service regressions
        run: cargo test --locked -p orion-ann-parlay -p orion-ann-runtime -p orion-ann-cli
      # Native Linux jobs validate the C++ backend; cross-check Rust without a Linux C++ sysroot.
      - name: Cross-check AVX2 fallback
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+avx2,+fma,+f16c'
        run: cargo check --locked -p orion-ann-vector -p orion-ann -p orion-ann-diskann -p orion-ann-cli -p orion-ann-runtime --no-default-features --target x86_64-unknown-linux-gnu
      - name: Cross-check AVX-512
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+avx2,+fma,+f16c,+avx512f,+avx512bw,+avx512dq,+avx512vl,+avx512vpopcntdq'
        run: cargo check --locked -p orion-ann-vector -p orion-ann -p orion-ann-diskann -p orion-ann-cli -p orion-ann-runtime --no-default-features --target x86_64-unknown-linux-gnu
      - name: Vector Clippy
        run: cargo clippy --locked -p orion-ann-vector --release -- -D warnings

  summary:
    needs: [compile-check-cross, build-and-test, python-api, portable-api]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all compilation and eligible runtime checks
        env:
          CROSS_RESULT: ${{ needs.compile-check-cross.result }}
          LINUX_RESULT: ${{ needs.build-and-test.result }}
          PORTABLE_RESULT: ${{ needs.portable-api.result }}
          PYTHON_RESULT: ${{ needs.python-api.result }}
        run: |
          echo "macOS/cross: $CROSS_RESULT; Linux SIMD matrix: $LINUX_RESULT; Python API: $PYTHON_RESULT; portable API: $PORTABLE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$CROSS_RESULT" == success && "$LINUX_RESULT" == success && "$PYTHON_RESULT" == success && "$PORTABLE_RESULT" == success ]]

  python-api:
    name: Python API / CLI consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+avx2,+fma,+f16c'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-api
      - name: Check CPU and install local test dependencies
        run: |
          bash .github/scripts/check-cpu-features.sh 'avx2 fma f16c'
          python -m pip install 'numpy>=1.24,<3'
          cargo fetch --locked
      - name: Byte-distance, shared runtime and CLI regressions
        run: |
          # Debug overflow checks cover the scalar stream fallback on AVX2.
          cargo test --locked -p orion-ann-vector --test native_u8_stream
          cargo test --locked -p orion-ann-runtime -p orion-ann-cli
          cargo test --locked -p orion-ann --test error_contract
      - name: NumPy, persistence and CLI parity
        run: |
          python orion-py/tests/run.py
          python orion-py/tests/run.py --profile python

  portable-api:
    name: Portable x86 / public API and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Override repository AVX2 flags: exercise runtime feature dispatch.
      RUSTFLAGS: '-C target-cpu=x86-64 -D warnings'
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-api
      - name: Portable distance and service regressions
        env:
          ORION_TEST_REQUIRED_BACKENDS: 'scalar,avx2'
        run: |
          cargo test --locked -p orion-ann-vector --release
          cargo test --locked -p orion-ann -p orion-ann-parlay -p orion-ann-runtime -p orion-ann-cli
          cargo test --locked -p orion-ann-diskann --lib
      - name: Public API examples and warning-free docs
        run: |
          cargo test --locked --doc -p orion-ann -p orion-ann-runtime
          cargo doc --locked --workspace --no-deps
