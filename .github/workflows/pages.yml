name: Orion Website Pages

on:
  push:
    branches: [pages]
  pull_request:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orion-site-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Manual runs must select pages. main intentionally has no website data.
    if: github.ref == 'refs/heads/pages' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: orion-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: orion-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test catalog data, selections and components
        run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Check Svelte types and build for the Pages subpath
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: orion-site/dist/

  deploy:
    if: github.ref == 'refs/heads/pages' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested site
        id: deployment
        uses: actions/deploy-pages@v4
