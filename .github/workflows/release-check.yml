name: Release validation

# Validate every pushed commit and PR, not only a tag. This workflow never publishes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''
  CARGO_BUILD_JOBS: '2'

jobs:
  rust-packages:
    name: Public crates / external consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - name: Package, extract, build consumer and install CLI
        run: python .github/scripts/release/crates.py --output dist/crates
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crates
          path: dist/crates/
          if-no-files-found: error

  python-packages:
    name: Wheel and sdist / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
            manylinux: '2014'
          - os: macos-15
            target: aarch64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # manylinux runs as root. The action chowns its output directory, but
      # not parents it created; those must belong to the runner before Docker.
      - name: Prepare runner-owned artifact directories
        run: mkdir -p dist/python/original
      - name: Prepare locked Python source workspace
        run: |
          python -m pip install 'maturin==1.16.0'
          python -m unittest discover -s .github/scripts/release -p 'test_*.py'
          cargo fetch --locked
          python .github/scripts/release/python_source.py --output dist/python
      - uses: PyO3/maturin-action@v1
        with:
          version: '1.16.0'
          command: build
          args: --manifest-path dist/python/source/orion-py/Cargo.toml --profile python --locked --sdist --out dist/python/original
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: '1.92.0'
      - name: Validate metadata and independently rebuild source archive
        run: |
          python -m pip install 'twine>=6,<7' 'packaging>=25'
          python -m twine check dist/python/original/*.whl dist/python/original/*.tar.gz
          python .github/scripts/release/python_dist.py --artifacts dist/python/original --output dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-candidate-${{ matrix.os }}
          path: dist/python/original/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          # The host-rebuilt wheel is verification evidence, not a publish candidate.
          name: python-validation-${{ matrix.os }}
          path: |
            dist/python/validation.json
            dist/python/source-lock.json
            dist/python/SHA256SUMS
            dist/python/artifact-hashes.json
            dist/python/from-sdist/
          if-no-files-found: error

  python-install:
    name: Installed wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: python-packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.9', '3.13']
        include:
          - python: '3.9'
            numpy: 'numpy==1.24.4'
          - python: '3.13'
            numpy: 'numpy>=2.1,<3'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-candidate-${{ matrix.os }}
          path: candidate
      - uses: actions/setup-python@v5
        id: control
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v5
        id: test
        with:
          python-version: ${{ matrix.python }}
      - name: Install candidate in fresh environment and exercise default backend
        run: >-
          '${{ steps.control.outputs.python-path }}' .github/scripts/release/python_dist.py
          --artifacts candidate --output validation --install-only
          --python '${{ steps.test.outputs.python-path }}' --numpy '${{ matrix.numpy }}'
      - uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.os }}-${{ matrix.python }}
          path: validation/
          if-no-files-found: error

  release-ready:
    name: Release validation gate
    if: always()
    needs: [rust-packages, python-packages, python-install]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every package and installation check
        env:
          RUST_RESULT: ${{ needs.rust-packages.result }}
          PYTHON_RESULT: ${{ needs.python-packages.result }}
          INSTALL_RESULT: ${{ needs.python-install.result }}
        run: |
          echo "Crates: $RUST_RESULT; wheels/sdist: $PYTHON_RESULT; installed matrix: $INSTALL_RESULT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$RUST_RESULT" == success && "$PYTHON_RESULT" == success && "$INSTALL_RESULT" == success ]]
