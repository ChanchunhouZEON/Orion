[package]
publish = false
name = "adsampling"
version = "0.1.0"
edition = "2024"
description = "ADSampling: random rotation + incremental distance with probabilistic early abandon (Gao & Long, SIGMOD 2023)."

[features]
benchmark = ["dep:rand", "dep:rayon", "dep:log"]

[dependencies]
rand = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
