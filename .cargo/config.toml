[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx2,+fma"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+avx2,+fma"]

# aarch64 targets: NEON enabled by default. `+dotprod` enables
# FEAT_DotProd intrinsics (`vdotq_s32` / `vdotq_u32`); supported on
# all M1/M2/M3 Apple Silicon, gives a 4× reduction in NEON op count
# for the i8 IP kernel vs the legacy `vmull + vpadalq` chain.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-feature=+dotprod"]