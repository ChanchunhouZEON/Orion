[package]
name = "orion-storage-bench"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hdrhistogram = "7"
bytemuck = "1"
libc = "0.2"
tempfile = "3"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
orion-ann-core = { path = "../../orion-core", default-features = false, features = ["experimental-storage"] }
orion-ann-diskann = { path = "../../orion-diskann" }
orion-ann-platform = { path = "../../orion-platform" }
orion-ann-vector = { path = "../../orion-vector" }
orion-ann-ssd = { path = "../../orion-ssd" }
[profile.release]
debug = 1
lto = "thin"
