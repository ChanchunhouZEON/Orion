[package]
publish = false
rust-version = "1.92"
name = "benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
orion-ann = { version = "0.1.0", path = "../orion-runtime", features = ["cli", "benchmark", "file-queries"] }
adsampling = { path = "../adsampling", features = ["benchmark"] }
orion-ann-diskann = { version = "0.1.0", path = "../orion-diskann" }
orion-ann-platform = { version = "0.1.0", path = "../orion-platform" }
orion-ann-core = { version = "0.1.0", path = "../orion-core", default-features = false, features = ["benchmark"] }
orion-ann-vector = { version = "0.1.0", path = "../orion-vector" }
anyhow = "1"
rayon = "1"
ndarray = { version = "0.16", features = ["rayon", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
indicatif = "0.17"
thiserror = "2"
rand = "0.10"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
comfy-table = "=7.1.4"
serde_yaml = "0.9"
sha2 = "0.10"
hdrhistogram = { version = "7.5", default-features = false }

[[bin]]
name = "orion-sweep"
path = "src/bin/orion_sweep.rs"

[[bin]]
name = "latency-sweep"
path = "src/bin/latency_sweep.rs"

[dev-dependencies]
tempfile = "3"

# Resolve experiments independently of the production feature graph.
[workspace]
resolver = "2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 2
lto = "thin"
codegen-units = 4
