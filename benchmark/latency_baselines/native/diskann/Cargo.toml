[package]
name = "baseline-latency-diskann"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
orion-ann-diskann = { path = "../../../../orion-diskann", features = ["orion", "benchmark"] }
orion-ann-vector = { path = "../../../../orion-vector" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
codegen-units = 1
lto = "thin"
