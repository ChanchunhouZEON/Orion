# QPS-Recall Sweep Configuration
#
# Per-dataset source of truth for the benchmark harness. `main.rs` and
# `staged_sweep.rs` both resolve dataset paths, build parameters, and
# the staged search metric through this file.

defaults:
  diskann:
    alpha: 2.0
    graph_degree: 64
    build_search_list_size: 100
  staged:
    alpha: 1.2
    graph_degree: 64
    build_search_list_size: 100
    # Hard cap on per-node `extras` zone after the top-X% partition.
    # 16 chosen empirically (R=100 / 6.25) — the cap controls
    # PhasedGraph slot stride directly so smaller = better cache
    # locality. Per-dataset overrides may set a different value.
    max_extra: 16
    window_size: 5
    # ── Cascade triple (search-time, replaces the legacy `metric`) ──
    # The unified search pipeline reads these directly; per-dataset
    # blocks below override what their workload needs. Mirrors the
    # `Cascade::default_for_dataset` mapping in `staged_diskann.rs`.
    #   prefilter: none | jl | jl-hadamard | rabitq
    #   admission: l2-u8 | l2-u16 | l2-kt | mips-i8 | mips-i16 | ads-f32
    #   rerank:    f32 | ip-f32 | u16
    prefilter: none
    admission: l2-u8
    rerank: f32
  sweep:
    search_list_sizes: [16, 20, 24, 32, 40, 48, 56, 64, 80, 100, 128, 160, 200, 256, 512, 768, 1024]
    threads: 8
    trials: 1

# ── Base-graph source policy ───────────────────────────────────────────────
# Each dataset may set `base_graph.source = rust|parlayann`:
#   rust       — build the graph in-process via `build_diskann_index`
#                using the `staged.{alpha,graph_degree,...}` params above.
#   parlayann  — import a `.staged v2` export produced by ParlayANN's
#                `./neighbors -staged_outfile`, so our PhasedGraph sits
#                on top of PA's RNG-pruned Vamana graph. Requires
#                `base_graph.staged_file`. The importer is
#                `benchmark/src/runner/parlayann_bridge.rs`; the resulting
#                PhasedGraph is cached under `cache/staged_parlayann/`
#                so subsequent runs hit the fast load path.
#
# When `source: parlayann`, the `staged.{graph_degree, alpha, build_l,
# max_extra}` params above are **advisory** (they feed the cache-filename
# convention and calibration) — the actual graph topology comes from PA.
#
# `staged_file` paths may contain the placeholder `${PA_ROOT}`, which is
# resolved against the `PA_ROOT` env var at load time (default
# `../ParlayANN`, relative to the repo root). Keep user-specific
# absolute paths out of this file so the config stays portable.

datasets:
  sift:
    dimension: 128
    paths:
      base:        "data/sift/sift_base.fvecs"
      query:       "data/sift/sift_query.fvecs"
      groundtruth: "data/sift/sift_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # PA's `-two_pass 1` vamana export (α=1.15 R=64) — the graph PA
      # publishes its SIFT1M recall-QPS numbers on. Produced by:
      #   PA_NUM_PASSES=2 DATASET=sift bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/sift1m/sift1m_ex${max_extra}.staged"
    staged:
      alpha: 1.15
      graph_degree: 64
      build_search_list_size: 128
      # SIFT: low/mid-D L2; direct u8 admission, no prefilter needed.
      prefilter: none
      admission: l2-u8
      rerank: f32
  glove25:
    dimension: 32
    paths:
      # Pre-normalized fvecs — cosine on normalized ≡ L2 on unit
      # vectors, so the graph built under L2 is the same shape PA
      # would build in angular mode.
      base:        "data/glove25_norm/glove-25-angular_base.fvecs"
      query:       "data/glove25_norm/glove-25-angular_query.fvecs"
      groundtruth: "data/glove25_norm/glove-25-angular_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # Produced by:
      #   PA_NUM_PASSES=2 DATASET=glove25 bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/glove25/glove25_ex${max_extra}.staged"
    staged:
      alpha: 1.0
      graph_degree: 100
      build_search_list_size: 200
      # GloVe-25: normalised angular, single-phase i8 sdot.
      prefilter: none
      admission: mips-i8
      rerank: ip-f32
  glove100:
    dimension: 100
    paths:
      base:        "data/glove100_norm/glove-100-angular_base.fvecs"
      query:       "data/glove100_norm/glove-100-angular_query.fvecs"
      groundtruth: "data/glove100_norm/glove-100-angular_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # 2-pass PA-built graph — our production config that wins ~10%
      # vs PA native angular in the main sweep. Produced by:
      #   PA_NUM_PASSES=2 DATASET=glove100 bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/glove100/glove100_ex${max_extra}.staged"
    staged:
      alpha: 1.0
      graph_degree: 100
      build_search_list_size: 200
      # GloVe-100: memory-bound — i8 beam + top-20 f32 rerank
      # (matches `vamana/scripts/glove100`).
      prefilter: none
      admission: mips-i8
      rerank: ip-f32
  gist:
    dimension: 960
    paths:
      base:        "data/gist/gist_base.fvecs"
      query:       "data/gist/gist_query.fvecs"
      groundtruth: "data/gist/gist_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # GIST 1M — ParlayANN-aligned recipe (R=100 L=200 α=1.1 2-pass)
      # matching `../ParlayANN/algorithms/vamana/scripts/gist`.
      # Produced by:
      #   PA_NUM_PASSES=2 DATASET=gist bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/gist/gist_ex${max_extra}.staged"
    staged:
      # Aligned with ParlayANN `vamana/scripts/gist`:
      #   BUILD_ARGS="-R 100 -L 200 -alpha 1.1 -num_passes 2"
      # Replaces the prior local recipe (R=32 L=48 α=1.5) which built
      # a much sparser graph and capped recall on the high band.
      alpha: 1.1
      graph_degree: 100
      build_search_list_size: 200
      # GIST: D=960 — JL prefilter at 1 line/vert gates the wider
      # L2-kt slab; kernel-trick recovers exact L2 ranking via sdot.
      prefilter: jl
      admission: l2-kt
      rerank: f32
  deep10m:
    dimension: 128
    paths:
      # Yandex Deep10M — first 10M of Deep1B, native D=96 zero-padded
      # to D=128 by `convert_fbin.py --pad-to-dim 128` so the f32 rerank
      # stride lands on a 32-byte SIMD boundary (D=100 would overrun).
      base:        "data/deep10m/deep10m_base.fvecs"
      query:       "data/deep10m/deep10m_query.fvecs"
      groundtruth: "data/deep10m/deep10m_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # Mirrors `../ParlayANN/algorithms/vamana/scripts/deep10M`.
      # Produced by:
      #   PA_NUM_PASSES=2 DATASET=deep10m bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/deep10M/deep10M_ex${max_extra}.staged"
    staged:
      # Aligned with ParlayANN `vamana/scripts/deep10M`:
      #   BUILD_ARGS="-R 64 -L 128 -alpha 1.05 -num_passes 2 -quantize_bits 8"
      alpha: 1.05
      graph_degree: 64
      build_search_list_size: 128
      # Deep10M: low/mid-D L2 like SIFT.
      prefilter: none
      admission: l2-u8
      rerank: f32
  fashion-mnist:
    dimension: 784
    paths:
      base:        "data/fashion-mnist/fashion-mnist-784-euclidean_base.fvecs"
      query:       "data/fashion-mnist/fashion-mnist-784-euclidean_query.fvecs"
      groundtruth: "data/fashion-mnist/fashion-mnist-784-euclidean_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # Mirrors `../ParlayANN/algorithms/vamana/scripts/fashion`.
      # Produced by:
      #   PA_NUM_PASSES=2 DATASET=fashion-mnist bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/fashion-mnist-784-euclidean/fashion-mnist-784-euclidean_ex${max_extra}.staged"
    staged:
      # Aligned with ParlayANN `vamana/scripts/fashion`:
      #   BUILD_ARGS="-R 40 -L 80 -alpha 1.1 -num_passes 2 -quantize_bits 8"
      alpha: 1.1
      graph_degree: 40
      build_search_list_size: 80
      # Fashion-MNIST: 60 K × 784 — too small for JL setup tax;
      # L2-kt admission is the speed knob.
      prefilter: none
      admission: l2-kt
      rerank: f32
  msmarco_bert_1M:
    dimension: 768
    paths:
      # 1M MS-MARCO passages embedded with
      # sentence-transformers/msmarco-bert-base-dot-v5 (D=768, raw dot
      # product). Vectors produced by `data/embed_msmarco_bert.py` —
      # NOT pre-normalised; GT is brute-force MIPS on raw f32.
      base:        "data/msmarco_bert_1M/msmarco_bert_1M_base.fvecs"
      query:       "data/msmarco_bert_1M/msmarco_bert_1M_query.fvecs"
      groundtruth: "data/msmarco_bert_1M/msmarco_bert_1M_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # Mirrors `../ParlayANN/algorithms/vamana/scripts/msmarco_websearch`.
      # Produced by:
      #   PA_NUM_PASSES=1 DATASET=msmarco_bert_1M bash benchmark/scripts/prepare_parlayann_data.sh
      staged_file: "${PA_ROOT}/data/MSMarcoBert1M/MSMarcoBert1M_ex${max_extra}.staged"
    staged:
      # Aligned with ParlayANN `vamana/scripts/msmarco_websearch`:
      #   BUILD_ARGS="-R 64 -L 128 -alpha 1 -num_passes 1 -quantize_bits 8"
      alpha: 1.0
      graph_degree: 64
      build_search_list_size: 128
      # MS-MARCO BERT 1M: raw MIPS; JL empirically hurts both QPS and
      # recall on this dataset (setup tax + filters genuine top-K,
      # see README "MS-MARCO BERT 1M" section).
      prefilter: none
      admission: mips-i8
      rerank: ip-f32
  wiki_ada_1M:
    dimension: 1536
    paths:
      # 1M Wikipedia passages × 1536-D OpenAI ada-002 embeddings,
      # sourced from `nlpkevinl/wikipedia_openai_embeddings` via
      # `data/load_wiki_ada_1M.py`. ada-002 outputs are unit-norm so
      # MIPS == cosine ranking natively.
      base:        "data/wiki_ada_1M/wiki_ada_1M_base.fvecs"
      query:       "data/wiki_ada_1M/wiki_ada_1M_query.fvecs"
      groundtruth: "data/wiki_ada_1M/wiki_ada_1M_groundtruth.ivecs"
    base_graph:
      source: parlayann
      # Built via `prepare_parlayann_data.sh` with the high-D MIPS
      # shape (R=100 L=200 α=1.05 num_passes=2) — there's no direct
      # PA `vamana/scripts/<wiki_ada>` recipe so we mirror the
      # OpenAIArXiv shape (closest D + same dot-product metric).
      staged_file: "${PA_ROOT}/data/WikiAda1M/WikiAda1M_ex${max_extra}.staged"
    staged:
      alpha: 1.05
      graph_degree: 100
      build_search_list_size: 200
      # Wiki-ada-002 1M: high-D cosine; JL at 1 line/vert gates the
      # 1536-D admission slab.
      prefilter: jl
      admission: mips-i8
      rerank: ip-f32
