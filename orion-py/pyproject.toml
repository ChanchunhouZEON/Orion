[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "orion-ann"
version = "0.1.0"
description = "Python interface to Orion approximate nearest-neighbor search"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "third_party/*-LICENSE"]
keywords = ["ann", "nearest-neighbors", "vector-search"]

[project.urls]
Repository = "https://github.com/ChanchunhouZEON/Orion"
Documentation = "https://github.com/ChanchunhouZEON/Orion/tree/main/orion-py"

[tool.maturin]
python-source = "python"
module-name = "orion_ann._native"
manifest-path = "Cargo.toml"
profile = "python"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
