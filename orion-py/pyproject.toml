[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "orion-py"
version = "0.1.0"
description = "Python interface to Orion approximate nearest-neighbor search"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
readme = "README.md"
license = {text = "MIT"}

[tool.maturin]
python-source = "python"
module-name = "orion_py._native"
manifest-path = "Cargo.toml"
profile = "python"
features = ["pyo3/extension-module"]
