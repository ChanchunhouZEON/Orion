[package]
publish = false
name = "orion-ann-python"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python extension backend for Orion ANN"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false

[features]
test-hooks = []

[dependencies]
orion-ann = { version = "0.1.0", path = "../orion-runtime", features = ["file-queries"] }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
ndarray.workspace = true
serde_json.workspace = true

[build-dependencies]
pyo3-build-config = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }
