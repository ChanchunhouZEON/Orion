[package]
name = "orion-ann-wasm"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly trace replay for Orion ANN"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
orion-ann-diagnostics = { version = "0.1.0", path = "../orion-diagnostics", default-features = false }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
