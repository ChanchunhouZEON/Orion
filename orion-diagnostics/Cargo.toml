[package]
name = "orion-ann-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable search traces, replay and error reports for Orion ANN"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["native"]
native = ["dep:orion-ann"]

[dependencies]
orion-ann-error = { version = "0.1.0", path = "../orion-error" }
orion-ann = { version = "0.1.0", path = "../orion", optional = true }
serde.workspace = true
serde_json.workspace = true
