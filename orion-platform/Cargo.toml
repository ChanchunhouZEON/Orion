[package]
name = "orion-ann-platform"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Aligned I/O, block writes and memory support for Orion ANN"
readme = "README.md"
keywords = ["ann", "vector-search", "similarity"]
categories = ["algorithms"]
include = ["src/**", "tests/**", "configs/**", "Cargo.toml", "README.md", "LICENSE"]
edition = "2021"

[dependencies]
memmap2 = { workspace = true }
libc = { workspace = true }
crossbeam = { workspace = true }
hashbrown = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
orion-ann-vector = { version = "0.1.0", path = "../orion-vector" }
once_cell = { workspace = true }


bytemuck.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
approx = "0.5"