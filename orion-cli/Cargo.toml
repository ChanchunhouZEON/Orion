[package]
name = "orion-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orion"
path = "src/main.rs"

[dependencies]
orion-runtime = { path = "../orion-runtime", features = ["cli"] }
orion = { path = "../orion" }
vector = { path = "../vector" }
rayon = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
serde_yaml = "0.9"
