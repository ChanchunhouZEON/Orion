[package]
name = "orion-ann-cli"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Orion ANN"
readme = "README.md"
keywords = ["ann", "vector-search", "similarity"]
categories = ["algorithms"]
include = ["src/**", "tests/**", "configs/**", "Cargo.toml", "README.md", "LICENSE"]
edition = "2021"

[[bin]]
name = "orion"
path = "src/main.rs"

[features]
default = ["parlay"]
parlay = ["orion-ann/parlay"]
benchmark = ["orion-ann/benchmark"]

[dependencies]
orion-ann = { version = "0.1.0", path = "../orion-runtime", default-features = false, features = ["cli"] }
orion-ann-core = { version = "0.1.0", path = "../orion-core", default-features = false, features = ["search-stats"] }
orion-ann-vector = { version = "0.1.0", path = "../orion-vector" }
rayon = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
log = { workspace = true }
env_logger = { workspace = true }
