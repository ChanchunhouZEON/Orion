defaults:
  diskann:
    alpha: 2.0
    graph_degree: 64
    build_search_list_size: 100
  orion:
    alpha: 1.2
    graph_degree: 64
    build_search_list_size: 100
    max_extra: 16
    window_size: 5
    prefilter: none
    admission: l2-u8
    rerank: f32
  sweep:
    k: 10
    threads: 8
    trials: 1
    calibration:
      samples: 200
      base_l: 48
      diagnostic_l: 100
    schedules_by_k:
      10:
        sweep:
        - 64
datasets:
  fixture:
    dimension: 128
    metric: l2
    paths:
      base: base.bvecs
      query: query.bvecs
    base_graph:
      source: auto
      staged_file: graph.staged
  sift1b:
    num_points: 100
    num_queries: 2
    dimension: 128
    metric: l2
    max_points: 1000000000
    paths:
      base: data/sift1b/bigann_base.bvecs
      query: data/sift1b/bigann_query.bvecs
      groundtruth: data/sift1b/idx_1000M.ivecs
    base_graph:
      source: auto
      staged_file: ${PA_ROOT}/data/sift1b/sift1b_ex${max_extra}_pct60.staged
    orion:
      alpha: 1.15
      graph_degree: 64
      build_search_list_size: 128
      max_extra: 16
      vector_storage: u8
      prefilter: none
      admission: native-l2-u8
      rerank: none
