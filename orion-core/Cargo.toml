[package]
name = "orion-ann-core"
version = "0.1.0"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Adaptive graph search for approximate nearest neighbors"
readme = "README.md"
keywords = ["ann", "vector-search", "similarity"]
categories = ["algorithms"]
include = ["assets/**", "src/**", "tests/**", "configs/**", "Cargo.toml", "README.md", "LICENSE"]
edition = "2024"

[features]
experimental-graph = []
benchmark = ["search-stats", "orion-ann-vector/benchmark", "orion-ann-diskann/benchmark"]
search-stats = []
default = ["parlay"]
parlay = ["dep:orion-ann-parlay"]

[dependencies]
orion-ann-parlay = { version = "0.1.0", path = "../orion-parlay", optional = true }
orion-ann-error = { version = "0.1.0", path = "../orion-error" }
bytemuck = { workspace = true }
orion-ann-platform = { version = "0.1.0", path = "../orion-platform" }
orion-ann-vector = { version = "0.1.0", path = "../orion-vector" }
orion-ann-diskann = { version = "0.1.0", path = "../orion-diskann", features = ["orion"]}
rand = { workspace = true }
rayon = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
bincode = { workspace = true}
thiserror = { workspace = true }
byteorder = { workspace = true }
hashbrown = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = "1"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
orion-ann-parlay = { version = "0.1.0", path = "../orion-parlay", features = ["reference-tests"] }
